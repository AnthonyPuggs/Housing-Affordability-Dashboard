name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Restore renv library
        uses: r-lib/actions/setup-renv@v2

      - name: Run full test suite
        run: |
          fail=0
          for f in tests/test_*.R; do
            echo "::group::${f}"
            if Rscript "$f"; then
              echo "PASS: ${f}"
            else
              fail=1
              echo "::error file=${f}::Test script failed: ${f}"
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Validate release checklist
        run: Rscript -e "source('R/release_checklist.R'); validate_release_checklist()"
